<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi tienda</title>
  <style>
    :root {
      --coral: #ff6b6b;
      --turquesa: #12b5b0;
      --arena: #fff6ec;
      --azul: #0b3c5d;
      --amarillo: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--arena);
      color: var(--azul);
      padding-bottom: 40px;
    }

    /* ===== ENCABEZADO ===== */
    h1, .slogan, .autor {
      margin: 0;
      text-align: center;
      background: linear-gradient(135deg, var(--turquesa), var(--azul));
    }
    h1 { padding: 30px 16px 4px; font-size: 2.4rem; color: #fff; }
    .slogan { padding: 0 16px 6px; font-style: italic; font-size: 1.1rem; color: var(--amarillo); }
    .autor { padding: 0 16px 28px; font-size: 0.85rem; color: #d9f3f2; margin-bottom: 32px; }

    /* ===== PRODUCTOS ===== */
    #productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 20px;
    }

    #productos > div {
      position: relative;
      display: flex;
      flex-direction: column;
      text-align: center;
      padding: 12px 12px 18px;
      border-radius: 24px;
      border: 3px solid transparent;
      background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, var(--turquesa), var(--coral));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 8px 20px rgba(11, 60, 93, 0.12);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    #productos > div:nth-child(odd)  { transform: rotate(-1.2deg); }
    #productos > div:nth-child(even) { transform: rotate(1.2deg); }
    #productos > div:hover {
      transform: rotate(0) translateY(-10px) scale(1.03);
      box-shadow: 0 18px 35px rgba(255, 107, 107, 0.35);
    }

    #productos > div::before {
      content: "☀ NUEVO";
      position: absolute;
      top: 18px;
      left: -8px;
      z-index: 2;
      background: var(--amarillo);
      color: var(--azul);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 0 12px 12px 0;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    #productos img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 18px;
      display: block;
      transition: transform 0.4s;
    }
    #productos > div:hover img { transform: scale(1.06); }

    #productos h3 { margin: 14px 0 6px; font-size: 1.15rem; }
    #productos p { margin: 0 8px 8px; font-size: 0.85rem; line-height: 1.4; color: #4a6577; flex: 1; }
    #productos p:last-of-type { flex: 0; margin: 6px auto 12px; }
    #productos p:last-of-type strong {
      display: inline-block;
      background: linear-gradient(135deg, var(--coral), #ff9a6b);
      color: #fff;
      font-size: 1.1rem;
      padding: 6px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
    }

    /* ===== BOTONES ===== */
    button {
      background: var(--coral);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #e85555; }

    #productos button {
      background: linear-gradient(135deg, var(--turquesa), var(--azul));
      width: 85%;
      margin: 0 auto;
      padding: 11px;
    }
    #productos button::before { content: "🛍 "; }
    #productos button:hover { background: linear-gradient(135deg, var(--coral), #ff9a6b); transform: scale(1.05); }

    /* ===== CARRITO (dentro de su cuadro) ===== */
    div.carrito {
      display: block;
      margin: 50px auto;
      max-width: 440px;
      padding: 28px 24px 24px;
      border-radius: 28px;
      border: 3px solid transparent;
      background-color: #fff;
      background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, var(--turquesa), var(--coral));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 14px 34px rgba(11, 60, 93, 0.2);
    }
    div.carrito h2 { margin: 0 0 16px; text-align: center; font-size: 1.6rem; }

    #lista-carrito { list-style: none; padding: 0; margin: 0 0 16px; }
    #lista-carrito:empty::before {
      content: "🏖 Tu carrito está vacío. ¡Elige tu bikini favorito!";
      display: block;
      text-align: center;
      padding: 22px 12px;
      background: var(--arena);
      border: 2px dashed #ffb199;
      border-radius: 16px;
      color: #7a8d9b;
      font-size: 0.9rem;
    }
    #lista-carrito li {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: var(--arena);
      border-left: 5px solid var(--turquesa);
      border-radius: 12px;
      font-size: 0.9rem;
    }
    #lista-carrito li button {
      width: 30px;
      height: 30px;
      padding: 0;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--turquesa);
      font-size: 1.1rem;
      line-height: 1;
    }
    #lista-carrito li button:hover { background: var(--coral); transform: scale(1.15); }

    div.carrito p { margin: 16px 0; text-align: center; font-size: 1.1rem; }
    div.carrito p strong {
      display: inline-block;
      background: linear-gradient(135deg, var(--azul), var(--turquesa));
      color: #fff;
      padding: 10px 26px;
      border-radius: 40px;
      box-shadow: 0 6px 14px rgba(11, 60, 93, 0.3);
    }

    div.carrito > button {
      display: block;
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--coral), #ff9a6b);
      box-shadow: 0 6px 14px rgba(255, 107, 107, 0.4);
    }
    div.carrito > button::before { content: "🗑 "; }
    div.carrito > button:hover { transform: scale(1.03); }
  </style>
</head>
<body>
  <h1>👙 Coral Bay Swim</h1>
  <p class="slogan">Tu verano empieza aquí</p>
  <p class="autor">Catalin Marin</p>

  <div id="productos"></div>

  <div class="carrito">
    <h2>🛒 Carrito</h2>
    <ul id="lista-carrito"></ul>
    <p><strong>Total: $<span id="total">0.00</span></strong></p>
    <button onclick="vaciarCarrito()">Vaciar carrito</button>
  </div>

  <script>
    const productos = [
      {
        id: 1,
        nombre: "Bikini Rojo Pasión",
        descripcion: "Dos piezas en rojo intenso, ajuste cómodo y tela de secado rápido.",
        precio: 89000,
        imagen: "https://images.unsplash.com/photo-1581588636584-5c447d2c9d97?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 2,
        nombre: "Bikini Verde Selva",
        descripcion: "Verde esmeralda con tiras ajustables, ideal para días de playa.",
        precio: 95000,
        imagen: "https://images.unsplash.com/photo-1525672716948-1f0bb9c49883?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 3,
        nombre: "Bikini Floral Tropical",
        descripcion: "Estampado floral fresco, perfecto para vacaciones en el trópico.",
        precio: 99000,
        imagen: "https://images.unsplash.com/photo-1515161318750-781d6122e367?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 4,
        nombre: "Bikini Rosa Atardecer",
        descripcion: "Rosa suave con diseño clásico, cómodo y favorecedor.",
        precio: 85000,
        imagen: "https://images.unsplash.com/photo-1606792109963-7b34205b1333?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 5,
        nombre: "Bikini Amarillo Solar",
        descripcion: "Combinación amarillo y negro, un diseño atrevido para destacar.",
        precio: 92000,
        imagen: "https://images.unsplash.com/photo-1607031767948-cad28c6df79a?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 6,
        nombre: "Bikini Gris Urbano",
        descripcion: "Gris moderno de líneas simples, para un estilo minimalista.",
        precio: 88000,
        imagen: "https://images.unsplash.com/photo-1582639760270-076335e93696?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 7,
        nombre: "Bikini Beige Arena",
        descripcion: "Tono beige neutro y elegante, combina con todo.",
        precio: 90000,
        imagen: "https://images.unsplash.com/photo-1605248259586-a64eb06b6970?fm=jpg&q=70&w=500&auto=format&fit=crop"
      },
      {
        id: 8,
        nombre: "Bikini Rayas Marinero",
        descripcion: "Rayas rojas y blancas de estilo retro, un clásico de verano.",
        precio: 97000,
        imagen: "https://images.pexels.com/photos/32580910/pexels-photo-32580910.jpeg?auto=compress&cs=tinysrgb&w=500"
      }
    ];

    let carrito = [];

    function formato(n) {
      return n.toLocaleString("es-CO");
    }

    function mostrarProductos() {
      const cont = document.getElementById("productos");
      cont.innerHTML = productos.map(p => `
        <div>
          <img src="${p.imagen}" alt="${p.nombre}" onerror="this.style.display='none'">
          <h3>${p.nombre}</h3>
          <p>${p.descripcion}</p>
          <p><strong>$${formato(p.precio)}</strong></p>
          <button onclick="agregarAlCarrito(${p.id})">Agregar</button>
        </div>
      `).join("");
    }

    function agregarAlCarrito(id) {
      const item = carrito.find(i => i.id === id);
      if (item) {
        item.cantidad++;
      } else {
        carrito.push({ id: id, cantidad: 1 });
      }
      mostrarCarrito();
    }

    function cambiarCantidad(id, cambio) {
      const item = carrito.find(i => i.id === id);
      item.cantidad += cambio;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(i => i.id !== id);
      }
      mostrarCarrito();
    }

    function mostrarCarrito() {
      const lista = document.getElementById("lista-carrito");
      let total = 0;
      lista.innerHTML = carrito.map(i => {
        const p = productos.find(x => x.id === i.id);
        total += p.precio * i.cantidad;
        return `
          <li>
            ${p.nombre} — $${formato(p.precio)} x ${i.cantidad}
            <button onclick="cambiarCantidad(${i.id}, -1)">−</button>
            <button onclick="cambiarCantidad(${i.id}, 1)">+</button>
          </li>`;
      }).join("");
      document.getElementById("total").textContent = formato(total);
    }

    function vaciarCarrito() {
      carrito = [];
      mostrarCarrito();
    }

    mostrarProductos();
    mostrarCarrito();
  </script>
</body>
</html>
